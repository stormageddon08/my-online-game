<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#23452f">
    <title>Fenced Arena | My Online Games</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        background: #19372a;
        color: #fff8e6;
      }

      * { box-sizing: border-box; }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background:
          radial-gradient(circle at 50% 20%, #5f9270, transparent 45rem),
          #19372a;
      }

      main { width: min(100% - 2rem, 44rem); text-align: center; }
      a { color: #dce8c3; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #e8c66c; outline-offset: 4px; }
      h1 { margin: 1.2rem 0 0.4rem; font-family: Georgia, serif; font-size: clamp(2.4rem, 8vw, 4.5rem); font-weight: 400; }
      p { margin: 0; color: #d5e0ca; }

      .arena {
        position: relative;
        width: min(100%, 34rem);
        aspect-ratio: 1;
        margin: 2rem auto;
        border: clamp(0.7rem, 2.5vw, 1.2rem) solid #ebdfbd;
        outline: 0.35rem solid #7d5034;
        outline-offset: -0.5rem;
        background:
          repeating-linear-gradient(0deg, rgb(145 100 62 / 20%) 0 1px, transparent 1px 3rem),
          repeating-linear-gradient(90deg, rgb(145 100 62 / 15%) 0 1px, transparent 1px 3rem),
          #cda56e;
        box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 30%);
      }

      .post {
        position: absolute;
        width: 1.2rem;
        height: 1.2rem;
        border-radius: 50%;
        background: #6a402b;
        box-shadow: 0 1px 0 #f3e7c7;
      }

      .post:nth-child(1) { top: -0.6rem; left: -0.6rem; }
      .post:nth-child(2) { top: -0.6rem; right: -0.6rem; }
      .post:nth-child(3) { right: -0.6rem; bottom: -0.6rem; }
      .post:nth-child(4) { bottom: -0.6rem; left: -0.6rem; }
    </style>
  </head>
  <body>
    <main>
      <a href="index.html">← All games</a>
      <h1>Fenced Arena</h1>
      <p>A square fence.</p>
      <div class="arena" role="img" aria-label="A square fenced arena">
        <span class="post"></span><span class="post"></span><span class="post"></span><span class="post"></span>
      </div>
    </main>
  </body>
</html>
