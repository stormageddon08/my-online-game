<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101a2a">
    <title>Battle Arena | My Online Games</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101a2a;
        color: #f5f7fb;
        --gold: #f3c969;
        --red: #f06469;
        --blue: #6ea8fe;
        --panel: #18263a;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(ellipse at 50% 0%, rgb(114 63 126 / 35%), transparent 42rem),
          #101a2a;
      }

      main {
        width: min(100% - 2rem, 760px);
        margin: 0 auto;
        padding: 1.5rem 0 3rem;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
      }

      a { color: #aab7c9; text-decoration: none; }
      a:hover { color: #72d7c4; }
      a:focus-visible, button:focus-visible { outline: 3px solid #72d7c4; outline-offset: 4px; }

      h1 {
        margin: 2rem 0 0.4rem;
        font-size: clamp(2.4rem, 9vw, 4.5rem);
        letter-spacing: -0.07em;
        line-height: 1;
        text-align: center;
      }

      .subtitle { margin: 0; color: #aab7c9; text-align: center; }

      .arena {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1rem;
        margin-top: 2rem;
      }

      .fighter {
        position: relative;
        overflow: hidden;
        padding: 1.4rem;
        border: 1px solid #344863;
        border-radius: 1.25rem;
        background: var(--panel);
        box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 18%);
      }

      .fighter.enemy { border-color: rgb(240 100 105 / 55%); }
      .fighter h2 { margin: 0; font-size: 1.25rem; }
      .fighter p { margin: 0.3rem 0 1rem; color: #aab7c9; }

      .avatar {
        display: grid;
        width: 7rem;
        height: 7rem;
        margin: 0 auto 1rem;
        place-items: center;
        border-radius: 50%;
        background: linear-gradient(145deg, #263d64, #17253a);
        font-size: 4rem;
        box-shadow: inset 0 2px rgb(255 255 255 / 15%), 0 1rem 2rem rgb(0 0 0 / 25%);
      }

      .enemy .avatar { background: linear-gradient(145deg, #713c54, #2d2035); }

      .health-label {
        display: flex;
        justify-content: space-between;
        margin-bottom: 0.4rem;
        color: #c8d2df;
        font-size: 0.85rem;
        font-weight: 700;
      }

      .health-track {
        height: 0.8rem;
        overflow: hidden;
        border-radius: 99px;
        background: #0e1726;
      }

      .health-fill {
        width: 100%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #37c98b, #b9e36c);
        transition: width 250ms ease;
      }

      .enemy .health-fill { background: linear-gradient(90deg, #f3c969, #f06469); }

      .battle-status {
        min-height: 3rem;
        margin: 1rem 0 0;
        padding: 0.8rem 1rem;
        border: 1px solid #344863;
        border-radius: 0.9rem;
        background: rgb(24 38 58 / 75%);
        color: #dce5f1;
        text-align: center;
        line-height: 1.4;
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.7rem;
        margin-top: 1rem;
      }

      button {
        border: 1px solid #49617e;
        border-radius: 0.8rem;
        padding: 0.85rem 0.5rem;
        background: #20344f;
        color: #f5f7fb;
        font: inherit;
        font-weight: 750;
        cursor: pointer;
      }

      button:hover:not(:disabled) { background: #2b4668; transform: translateY(-2px); }
      button:disabled { cursor: not-allowed; opacity: 0.45; }
      .attack { border-color: #d47578; }
      .heavy { border-color: var(--gold); }
      .heal { border-color: #6ac79d; }

      .log {
        margin-top: 1rem;
        padding: 1rem 1.1rem;
        border: 1px solid #344863;
        border-radius: 1rem;
        background: #121f32;
      }

      .log h2 { margin: 0 0 0.6rem; font-size: 1rem; }
      .log ul { display: grid; gap: 0.35rem; margin: 0; padding-left: 1.2rem; color: #aab7c9; font-size: 0.9rem; }

      .restart {
        display: block;
        margin: 1rem auto 0;
        background: transparent;
      }

      @media (max-width: 560px) {
        main { width: min(100% - 1.25rem, 760px); }
        .arena { gap: 0.65rem; }
        .fighter { padding: 1rem; }
        .avatar { width: 5rem; height: 5rem; font-size: 2.8rem; }
        .controls { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <nav class="topbar" aria-label="Main navigation">
        <a href="index.html">← All games</a>
        <span>Solo battle</span>
      </nav>
      <h1>Battle Arena</h1>
      <p class="subtitle">Choose your move, defeat the shadow champion, and claim the arena.</p>

      <section class="arena" aria-label="Battle arena">
        <article class="fighter">
          <div class="avatar" aria-hidden="true">🛡️</div>
          <h2>Player</h2>
          <p>Brave challenger</p>
          <div class="health-label"><span>Health</span><span id="player-health-label">100 / 100</span></div>
          <div class="health-track" aria-label="Player health"><div class="health-fill" id="player-health"></div></div>
        </article>
        <article class="fighter enemy">
          <div class="avatar" aria-hidden="true">🐉</div>
          <h2>Shadow Champion</h2>
          <p>Ancient arena guardian</p>
          <div class="health-label"><span>Health</span><span id="enemy-health-label">100 / 100</span></div>
          <div class="health-track" aria-label="Enemy health"><div class="health-fill" id="enemy-health"></div></div>
        </article>
      </section>

      <p class="battle-status" id="status" aria-live="polite">Your turn. Choose an action.</p>
      <div class="controls" aria-label="Battle actions">
        <button class="attack" id="attack" type="button">⚔️ Quick attack</button>
        <button class="heavy" id="heavy" type="button">💥 Heavy strike</button>
        <button class="heal" id="heal" type="button">💚 Recover</button>
      </div>
      <section class="log" aria-label="Combat log">
        <h2>Combat log</h2>
        <ul id="log"></ul>
      </section>
      <button class="restart" id="restart" type="button">Restart battle</button>
    </main>
    <script>
      const maxHealth = 100;
      let playerHealth = maxHealth;
      let enemyHealth = maxHealth;
      let gameOver = false;
      let heavyReady = true;
      const playerHealthBar = document.querySelector("#player-health");
      const enemyHealthBar = document.querySelector("#enemy-health");
      const playerHealthLabel = document.querySelector("#player-health-label");
      const enemyHealthLabel = document.querySelector("#enemy-health-label");
      const status = document.querySelector("#status");
      const log = document.querySelector("#log");
      const actionButtons = [...document.querySelectorAll(".controls button")];

      function randomDamage(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function addLog(message) {
        const entry = document.createElement("li");
        entry.textContent = message;
        log.prepend(entry);
        while (log.children.length > 5) log.lastElementChild.remove();
      }

      function render() {
        playerHealthBar.style.width = `${playerHealth}%`;
        enemyHealthBar.style.width = `${enemyHealth}%`;
        playerHealthLabel.textContent = `${playerHealth} / ${maxHealth}`;
        enemyHealthLabel.textContent = `${enemyHealth} / ${maxHealth}`;
        actionButtons.forEach((button) => { button.disabled = gameOver; });
        document.querySelector("#heavy").disabled = gameOver || !heavyReady;
      }

      function enemyTurn() {
        if (enemyHealth <= 0) return;
        const damage = randomDamage(8, 16);
        playerHealth = Math.max(0, playerHealth - damage);
        addLog(`The Shadow Champion hits you for ${damage} damage.`);
        if (playerHealth <= 0) {
          gameOver = true;
          status.textContent = "Defeat. The arena belongs to the Shadow Champion.";
          addLog("You have fallen. Restart to try again.");
        } else {
          status.textContent = "Your turn. Choose an action.";
        }
      }

      function takeAction(action) {
        if (gameOver) return;
        if (action === "heal") {
          const amount = Math.min(20, maxHealth - playerHealth);
          if (amount === 0) {
            status.textContent = "Your health is already full. Choose another action.";
            return;
          }
          playerHealth += amount;
          addLog(`You recover ${amount} health.`);
        } else {
          const damage = action === "heavy" ? randomDamage(18, 30) : randomDamage(10, 18);
          enemyHealth = Math.max(0, enemyHealth - damage);
          addLog(`You deal ${damage} damage with a ${action === "heavy" ? "heavy strike" : "quick attack"}.`);
          if (action === "heavy") heavyReady = false;
          if (enemyHealth <= 0) {
            gameOver = true;
            status.textContent = "Victory! You are the champion of the arena.";
            addLog("The Shadow Champion has been defeated!");
            render();
            return;
          }
        }
        enemyTurn();
        render();
      }

      function reset() {
        playerHealth = maxHealth;
        enemyHealth = maxHealth;
        gameOver = false;
        heavyReady = true;
        log.replaceChildren();
        status.textContent = "Your turn. Choose an action.";
        addLog("The battle begins!");
        render();
      }

      document.querySelector("#attack").addEventListener("click", () => takeAction("quick"));
      document.querySelector("#heavy").addEventListener("click", () => takeAction("heavy"));
      document.querySelector("#heal").addEventListener("click", () => takeAction("heal"));
      document.querySelector("#restart").addEventListener("click", reset);
      reset();
    </script>
  </body>
</html>
